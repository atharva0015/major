services:
  postgres-db:
    image: postgres:15.5-alpine
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      # Fetch upstream init script before first up:
      # curl https://raw.githubusercontent.com/healenium/healenium/master/db/sql/init.sql -o db/sql/init.sql
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-healenium}
      - POSTGRES_USER=${POSTGRES_USER:-healenium_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme-local-only}
    networks:
      - healenium

  healenium:
    image: healenium/hlm-backend:3.5.1
    container_name: healenium
    restart: on-failure
    ports:
      - "7878:7878"
    depends_on:
      - postgres-db
    environment:
      - SPRING_POSTGRES_DB=${POSTGRES_DB:-healenium}
      - SPRING_POSTGRES_SCHEMA=healenium
      - SPRING_POSTGRES_USER=${POSTGRES_USER:-healenium_user}
      - SPRING_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme-local-only}
      - SPRING_POSTGRES_DB_HOST=postgres-db
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=true
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=info
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - healenium

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.6
    container_name: selector-imitator
    restart: on-failure
    ports:
      - "8000:8000"
    networks:
      - healenium

  hlm-proxy:
    image: healenium/hlm-proxy:2.2.1
    container_name: hlm-proxy
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - RECOVERY_TRIES=1
      - SCORE_CAP=.6
      - HEAL_ENABLED=true
      - SELENIUM_SERVER_URL=http://selenium-hub:4444/wd/hub
      - HEALENIUM_SERVER_URL=http://healenium:7878
      - HEALENIUM_SERVICE=http://healenium:7878
      - IMITATE_SERVICE=http://selector-imitator:8000
      - HLM_LOG_LEVEL=info
    volumes:
      - ./logs/:/logs
    depends_on:
      - healenium
      - selector-imitator
      - selenium-hub
      - chrome
    networks:
      - healenium

  # Selenium Grid (official Healenium base compose). Selenoid was removed:
  # aerokube/selenoid:latest-release speaks Docker API 1.24, but Docker
  # Desktop 29 requires >=1.40, so it can never spawn browsers here.
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    restart: on-failure
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - healenium

  chrome:
    image: selenium/node-chromium:latest
    container_name: node-chrome
    restart: on-failure
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=5
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=20
    networks:
      - healenium

  demo:
    image: python:3.12-slim
    container_name: demo-app
    working_dir: /work
    volumes:
      - ..:/work
    environment:
      # Drift control for live healing runs (default: no drift).
      - DRIFT_MODE=${DRIFT_MODE:-none}
      - API_DRIFT_MODE=${API_DRIFT_MODE:-none}
    # Bare slim image has no deps; install pinned floors at start (matches pyproject).
    command: ["sh", "-c", "pip install --no-cache-dir 'fastapi>=0.109' 'httpx>=0.27' 'uvicorn>=0.27' && python -m uvicorn demo_app.app:app --host 0.0.0.0 --port 8001"]
    ports:
      - "8001:8001"
    networks:
      - healenium

networks:
  healenium:
    name: healenium
