services:
  postgres-db:
    image: postgres:15.5-alpine
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      # Fetch upstream init script before first up:
      # curl https://raw.githubusercontent.com/healenium/healenium/master/db/sql/init.sql -o db/sql/init.sql
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-healenium}
      - POSTGRES_USER=${POSTGRES_USER:-healenium_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme-local-only}
    networks:
      - healenium

  healenium:
    image: healenium/hlm-backend:3.5.1
    container_name: healenium
    restart: on-failure
    ports:
      - "7878:7878"
    depends_on:
      - postgres-db
    environment:
      - SPRING_POSTGRES_DB=${POSTGRES_DB:-healenium}
      - SPRING_POSTGRES_SCHEMA=healenium
      - SPRING_POSTGRES_USER=${POSTGRES_USER:-healenium_user}
      - SPRING_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme-local-only}
      - SPRING_POSTGRES_DB_HOST=postgres-db
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=true
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=info
    networks:
      - healenium

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.6
    container_name: selector-imitator
    restart: on-failure
    ports:
      - "8000:8000"
    networks:
      - healenium

  hlm-proxy:
    image: healenium/hlm-proxy:2.2.1
    container_name: hlm-proxy
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - RECOVERY_TRIES=1
      - SCORE_CAP=.6
      - HEAL_ENABLED=true
      - SELENIUM_SERVER_URL=http://selenoid:4444/wd/hub
      - HEALENIUM_SERVER_URL=http://healenium:7878
      - HEALENIUM_SERVICE=http://healenium:7878
      - IMITATE_SERVICE=http://selector-imitator:8000
      - HLM_LOG_LEVEL=info
    depends_on:
      - healenium
      - selector-imitator
      - selenoid
    networks:
      - healenium

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    ports:
      - "4444:4444"
    volumes:
      # Provide ./selenoid-config/browsers.json (see docs/HEALENIUM.md).
      - ./selenoid-config:/etc/selenoid:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["-conf", "/etc/selenoid/browsers.json", "-container-network", "healenium"]
    networks:
      - healenium

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    restart: on-failure
    ports:
      - "8080:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - healenium

  demo:
    image: python:3.12-slim
    container_name: demo-app
    working_dir: /work
    volumes:
      - ..:/work
    command: python -m uvicorn demo_app.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    networks:
      - healenium

networks:
  healenium:
    name: healenium
